<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bouncing Ball</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .ball {
            width: 50px;
            height: 50px;
            background: #e74c3c;
            border-radius: 50%;
            animation: bounce 1s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-100px); }
        }
    </style>
</head>
<body>
    <div class="ball"></div>
</body>
</html>
