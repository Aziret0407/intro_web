<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fade In Effect</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .text {
            font-size: 24px;
            opacity: 0.3;
            transition: opacity 0.5s;
            cursor: pointer;
        }
        .text:hover { opacity: 1; }
    </style>
</head>
<body>
    <p class="text">Hover to fade in</p>
</body>
</html>
