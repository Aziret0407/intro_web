<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Expanding Button</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .btn {
            padding: 15px 30px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .btn:hover { transform: scale(1.2); }
    </style>
</head>
<body>
    <button class="btn">Hover Me</button>
</body>
</html>
