<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3: Feedback Form</title>
</head>
<body>
    <h1>Feedback Form</h1>

    <form method="post">
        <input type="hidden" id="page_id" name="page_id" value="feedback_page_001">

        <label for="name">Your Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Your Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="feedback">Your Feedback:</label><br>
        <textarea id="feedback" name="feedback" rows="5" cols="40" required></textarea><br><br>

        <button type="submit">Submit Feedback</button>
    </form>

    <p><small>Hidden field value: "feedback_page_001" (used for tracking)</small></p>
</body>
</html>
