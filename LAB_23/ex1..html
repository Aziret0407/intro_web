<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1: Images</title>
</head>
<body>
    <h1>Working with Images in HTML</h1>

    <h2>Local Image Example</h2>
    <img src="image.jpg" alt="Sample image" width="300" height="200">

    <h2>Online Image Example</h2>
    <img src="https://www.w3schools.com/html/pic_trulli.jpg" alt="Italian house" width="300" height="200">

    <h2>Image with Alternative Text</h2>
    <img src="nonexistent.jpg" alt="This image cannot be displayed - alt text appears" width="300" height="200">

    <p><strong>Note:</strong> For local image to work, place an image file named "image.jpg" in the same folder.</p>
</body>
</html>
