<!DOCTYPE html>
<html>
<head>
    <title>Arrays & Objects - All Examples</title>
</head>
<body>
    <h1>Arrays & Objects - Check Console (F12)</h1>
    <hr>
    <h3>Lab 1: push and pop</h3>
    <hr>
    <h3>Lab 2: slice</h3>
    <hr>
    <h3>Lab 3: map</h3>
    <hr>
    <h3>Lab 4: filter</h3>
    <hr>
    <h3>Lab 5: Working with Objects</h3>
    <hr>
    <h3>Lab 6: Object Keys and Values</h3>

    <script>
        console.log("=== LAB 1: PUSH AND POP ===");
        let fruits = [];
        fruits.push("apple");
        fruits.push("banana");
        fruits.push("cherry");
        console.log("After push:", fruits);

        let last = fruits.pop();
        console.log("Removed:", last);
        console.log("After pop:", fruits);

        console.log("\n=== LAB 2: SLICE ===");
        let numbers = [10, 20, 30, 40, 50];
        let sliced = numbers.slice(1, 4);
        console.log("Original:", numbers);
        console.log("Sliced (1-4):", sliced);

        console.log("\n=== LAB 3: MAP ===");
        let nums = [1, 2, 3, 4, 5];
        let squared = nums.map(n => n * n);
        console.log("Original:", nums);
        console.log("Squared:", squared);

        console.log("\n=== LAB 4: FILTER ===");
        let ages = [12, 18, 25, 30, 15];
        let adults = ages.filter(age => age >= 18);
        console.log("All ages:", ages);
        console.log("Adults (18+):", adults);

        console.log("\n=== LAB 5: WORKING WITH OBJECTS ===");
        let user = {
            name: "Alice",
            age: 25,
            city: "New York"
        };
        console.log("Name:", user.name);
        user.age = 26;
        console.log("Updated user:", user);

        console.log("\n=== LAB 6: OBJECT KEYS AND VALUES ===");
        let car = { brand: "Tesla", model: "Model S", year: 2023 };
        let keys = Object.keys(car);
        let values = Object.values(car);
        console.log("Keys:", keys);
        console.log("Values:", values);
    </script>
</body>
</html>
