<!DOCTYPE html>
<html>
<head>
    <title>switch Statement</title>
</head>
<body>
    <h1>Check Console (F12)</h1>
    <script>
        let day = "Monday";

        switch(day) {
            case "Monday":
                console.log("Start of work week");
                break;
            case "Friday":
                console.log("Weekend is coming");
                break;
            case "Saturday":
            case "Sunday":
                console.log("It's weekend!");
                break;
            default:
                console.log("Regular day");
        }
    </script>
</body>
</html>
