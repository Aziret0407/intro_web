<!DOCTYPE html>
<html>
<head>
    <title>Comparative Operators</title>
</head>
<body>
    <h1>Check Console (F12)</h1>
    <script>
        let x = 15, y = 10;
        console.log("x =", x, "y =", y);
        console.log("x > y:", x > y);
        console.log("x < y:", x < y);
        console.log("x >= y:", x >= y);
        console.log("x <= y:", x <= y);
        console.log("x == y:", x == y);
        console.log("x === y:", x === y);
    </script>
</body>
</html>
