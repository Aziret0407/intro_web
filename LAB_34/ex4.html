<!DOCTYPE html>
<html>
<head>
    <title>if-else Statement</title>
</head>
<body>
    <h1>Check Console (F12)</h1>
    <script>
        let num = -5;

        if (num > 0) {
            console.log(num, "is positive");
        } else if (num < 0) {
            console.log(num, "is negative");
        } else {
            console.log("Number is zero");
        }
    </script>
</body>
</html>
