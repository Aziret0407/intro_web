<!DOCTYPE html>
<html>
<head>
    <title>Event Handling - All Examples</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        button, input { margin: 5px; padding: 8px 15px; cursor: pointer; }
        hr { margin: 20px 0; }
        .box { width: 200px; height: 100px; background: lightgray; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Event Handling - All Examples</h1>

    <hr>
    <h3>Lab 1: Button Click (onclick)</h3>
    <p id="lab1-text">Original message</p>
    <button onclick="document.getElementById('lab1-text').innerText = 'Button Clicked!'">
        Click Me
    </button>

    <hr>
    <h3>Lab 2: Mouse Hover (onmouseover / onmouseout)</h3>
    <div class="box" id="lab2-box"
         onmouseover="this.style.backgroundColor='blue'"
         onmouseout="this.style.backgroundColor='lightgray'">
    </div>

    <hr>
    <h3>Lab 3: Key Press Detection (onkeydown)</h3>
    <input type="text" id="lab3-input" placeholder="Type something..."
           onkeydown="document.getElementById('lab3-display').innerText = 'Last key: ' + event.key">
    <p id="lab3-display">Last key: </p>

    <hr>
    <h3>Lab 4: addEventListener (Click + Hover)</h3>
    <button id="lab4-btn">Click or Hover</button>

    <hr>
    <h3>Lab 5: Prevent Form Submission</h3>
    <form id="lab5-form">
        <input type="text" placeholder="Enter something">
        <button type="submit">Submit</button>
    </form>
    <p id="lab5-message"></p>

    <script>
        // Lab 4: addEventListener
        let btn = document.getElementById("lab4-btn");
        btn.addEventListener("click", function() {
            this.style.backgroundColor = "green";
            this.style.color = "white";
        });
        btn.addEventListener("mouseover", function() {
            this.style.backgroundColor = "orange";
        });
        btn.addEventListener("mouseout", function() {
            this.style.backgroundColor = "";
            this.style.color = "";
        });

        // Lab 5: Prevent Form Submission
        document.getElementById("lab5-form").addEventListener("submit", function(event) {
            event.preventDefault();
            document.getElementById("lab5-message").innerText = "Form submission prevented!";
        });
    </script>
</body>
</html>
