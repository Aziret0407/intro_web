<!DOCTYPE html>
<html>
<head>
    <title>Variables</title>
</head>
<body>
    <h1>Check Console (F12)</h1>
    <script>
        var name = "John";
        let age = 25;
        const country = "USA";

        console.log("Initial:", name, age, country);

        name = "Mike";
        age = 30;
        // country = "Canada"; // Error - const can't change

        console.log("After:", name, age, country);
    </script>
</body>
</html>
