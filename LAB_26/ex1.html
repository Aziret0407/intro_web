<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1: Basic Font Settings</title>
    <style>
        h1 {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: #333;
        }

        p {
            font-family: 'Times New Roman', Times, serif;
            font-size: 18px;
            font-weight: 400;
            line-height: 1.6;
            color: #555;
        }

        .bold-text {
            font-weight: 900;
            color: black;
        }

        .light-text {
            font-weight: 300;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>Font Settings Demonstration</h1>

    <p>This paragraph uses Times New Roman (serif), 18px, normal weight (400).</p>

    <p class="bold-text">This paragraph has font-weight 900 (extra bold).</p>

    <p class="light-text">This paragraph has font-weight 300 (light).</p>

    <p>You can see how different font weights create visual hierarchy.</p>
</body>
</html>
