<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 1: CSS Connection Methods</title>

    <!-- Internal CSS -->
    <style>
        h1 {
            color: red;
        }
    </style>

    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>This heading is styled with internal CSS (red)</h1>

    <!-- Inline CSS -->
    <p style="color: blue;">This paragraph is styled with inline CSS (blue)</p>

    <p>This paragraph is styled with external CSS (from styles.css)</p>
</body>
</html>
