<!DOCTYPE html>
<html>
<head>
    <title>Lab 5: Animations and Transitions</title>
    <style>
        body { font-family: Arial; padding: 20px; max-width: 1000px; margin: auto; }
        h2 { text-align: center; color: #333; }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .gallery img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }
        .gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-content {
            display: block;
            max-width: 80%;
            max-height: 80%;
            margin: auto;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 3px solid white;
            animation: zoomIn 0.3s ease;
        }
        @keyframes zoomIn {
            from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .close {
            position: absolute;
            top: 30px; right: 50px;
            color: white;
            font-size: 40px;
            cursor: pointer;
            z-index: 1001;
            transition: transform 0.3s ease;
        }
        .close:hover { transform: scale(1.2); }
        .prev, .next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: white;
            font-size: 40px;
            cursor: pointer;
            padding: 20px;
            z-index: 1001;
            transition: background 0.3s ease, transform 0.3s ease;
        }
        .prev { left: 30px; }
        .next { right: 30px; }
        .prev:hover, .next:hover {
            background: rgba(0,0,0,0.5);
            transform: translateY(-50%) scale(1.1);
        }
    </style>
</head>
<body>
    <h2>Lab 5: Animations and Transitions</h2>
    <div class="gallery" id="gallery"></div>

    <div id="modal" class="modal">
        <span class="close" onclick="closeModal()">&times;</span>
        <div class="prev" onclick="changeImage(-1)">&#10094;</div>
        <div class="next" onclick="changeImage(1)">&#10095;</div>
        <img class="modal-content" id="modalImage">
    </div>

    <script>
        let images = [
            "https://via.placeholder.com/800x600/3498db/ffffff?text=Image+1",
            "https://via.placeholder.com/800x600/e74c3c/ffffff?text=Image+2",
            "https://via.placeholder.com/800x600/2ecc71/ffffff?text=Image+3",
            "https://via.placeholder.com/800x600/f39c12/ffffff?text=Image+4",
            "https://via.placeholder.com/800x600/9b59b6/ffffff?text=Image+5",
            "https://via.placeholder.com/800x600/1abc9c/ffffff?text=Image+6"
        ];

        let gallery = document.getElementById("gallery");
        let modal = document.getElementById("modal");
        let modalImg = document.getElementById("modalImage");
        let currentIndex = 0;

        images.forEach((src, index) => {
            let img = document.createElement("img");
            img.src = src;
            img.alt = "Image " + (index + 1);
            img.onclick = function() {
                currentIndex = index;
                modal.style.display = "block";
                modalImg.src = src;
            };
            gallery.appendChild(img);
        });

        function changeImage(direction) {
            currentIndex += direction;
            if (currentIndex < 0) currentIndex = images.length - 1;
            if (currentIndex >= images.length) currentIndex = 0;

            modalImg.style.animation = "none";
            modalImg.offsetHeight;
            modalImg.style.animation = "zoomIn 0.3s ease";
            modalImg.src = images[currentIndex];
        }

        function closeModal() {
            modal.style.display = "none";
        }

        document.addEventListener('keydown', function(e) {
            if (modal.style.display === "block") {
                if (e.key === "ArrowLeft") changeImage(-1);
                if (e.key === "ArrowRight") changeImage(1);
                if (e.key === "Escape") closeModal();
            }
        });
    </script>
</body>
</html>
