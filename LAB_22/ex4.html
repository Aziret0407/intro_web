<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 4: Lists and Tables Together</title>
</head>
<body>
    <h1>Combining Lists and Tables</h1>

    <h2>Favorite Movies</h2>
    <ul>
        <li>Inception</li>
        <li>The Matrix</li>
        <li>Interstellar</li>
    </ul>

    <h2>Movie Details</h2>
    <table border="1">
        <tr>
            <th>Movie</th>
            <th>Year</th>
            <th>Genre</th>
        </tr>
        <tr>
            <td>Inception</td>
            <td>2010</td>
            <td>Sci-Fi</td>
        </tr>
        <tr>
            <td>The Matrix</td>
            <td>1999</td>
            <td>Action/Sci-Fi</td>
        </tr>
        <tr>
            <td>Interstellar</td>
            <td>2014</td>
            <td>Sci-Fi</td>
        </tr>
    </table>

    <hr>
    <p>This page demonstrates both lists and tables working together.</p>
</body>
</html>
