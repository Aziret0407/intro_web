<!DOCTYPE html>
<html>
<head>
    <title>Functions & Scope - All Examples</title>
</head>
<body>
    <h1>Functions & Scope - Check Console (F12)</h1>
    <hr>
    <h3>Lab 1: Creating Functions</h3>
    <hr>
    <h3>Lab 2: Local vs Global Scope</h3>
    <hr>
    <h3>Lab 3: Block Scope</h3>
    <hr>
    <h3>Lab 4: Closures</h3>

    <script>
        console.log("=== LAB 1: CREATING FUNCTIONS ===");

        function sum(a, b) {
            return a + b;
        }

        const square = x => x * x;

        const max = function(a, b) {
            return a > b ? a : b;
        };

        console.log("Sum (5+3):", sum(5, 3));
        console.log("Square of 4:", square(4));
        console.log("Max of 10 and 7:", max(10, 7));

        console.log("\n=== LAB 2: LOCAL VS GLOBAL SCOPE ===");

        let message = "Hello from global";

        function showMessage() {
            let message = "Hello from local";
            console.log("Inside function:", message);
        }

        showMessage();
        console.log("Outside function:", message);

        console.log("\n=== LAB 3: BLOCK SCOPE ===");

        if (true) {
            var varVar = "I'm var (accessible outside)";
            let letVar = "I'm let (block only)";
            const constVar = "I'm const (block only)";
            console.log("Inside block - all variables work");
        }

        console.log("Outside block - var:", varVar);
        // console.log(letVar); // Error if uncommented
        // console.log(constVar); // Error if uncommented

        console.log("\n=== LAB 4: CLOSURES ===");

        function createCounter() {
            let count = 0;
            return function() {
                count++;
                return count;
            };
        }

        let counter1 = createCounter();
        let counter2 = createCounter();

        console.log("Counter1 (1st call):", counter1());
        console.log("Counter1 (2nd call):", counter1());
        console.log("Counter2 (1st call):", counter2());
        console.log("Counter1 (3rd call):", counter1());
        console.log("Counter2 (2nd call):", counter2());
    </script>
</body>
</html>
