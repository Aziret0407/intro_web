<!DOCTYPE html>
<html>
<head>
    <title>Array with while Loop</title>
</head>
<body>
    <h1>Check Console (F12)</h1>
    <script>
        let fruits = ["Apple", "Banana", "Orange", "Mango", "Grape"];
        let i = 0;
        while (i < fruits.length) {
            console.log(fruits[i]);
            i++;
        }
    </script>
</body>
</html>
