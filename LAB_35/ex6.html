<!DOCTYPE html>
<html>
<head>
    <title>break Statement</title>
</head>
<body>
    <h1>Check Console (F12)</h1>
    <script>
        let numbers = [3, 7, 12, 5, 9];
        for (let i = 0; i < numbers.length; i++) {
            if (numbers[i] === 12) {
                console.log("Found 12, stopping loop");
                break;
            }
            console.log(numbers[i]);
        }
    </script>
</body>
</html>
