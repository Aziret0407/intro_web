<!DOCTYPE html>
<html>
<head>
    <title>continue Statement</title>
</head>
<body>
    <h1>Check Console (F12)</h1>
    <script>
        let numbers = [1, 2, 3, 4, 5, 6, 7];
        for (let i = 0; i < numbers.length; i++) {
            if (numbers[i] === 5) {
                continue;
            }
            console.log(numbers[i]);
        }
    </script>
</body>
</html>
