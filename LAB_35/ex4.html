<!DOCTYPE html>
<html>
<head>
    <title>Array with for Loop</title>
</head>
<body>
    <h1>Check Console (F12)</h1>
    <script>
        let fruits = ["Apple", "Banana", "Orange", "Mango", "Grape"];
        for (let i = 0; i < fruits.length; i++) {
            console.log(fruits[i]);
        }
    </script>
</body>
</html>
